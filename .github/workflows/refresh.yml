name: Refresh timings and deploy

on:
  schedule:
    - cron: "15 10 * * *"   # daily, ~4-5 AM Minnesota time
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # commit refreshed data back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch masajid, prayer timings and events
        run: python3 fetch.py

      - name: Save refreshed data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%F)"
          git push || echo "push skipped"

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/masajid.js data/masajid.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
